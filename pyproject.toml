[project]
name = "runoff-deep-learning"
version = "0.1.0"
description = "DMEL (MRS: CEEMDAN + Sample Entropy -> Informer/LSTM) para pronostico horario de caudal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.2.0",
    "pandas>=3.0.5",
    "scipy>=1.17.0",
    "torch==2.11.0",
]

[project.scripts]
dmel-decompose = "dmel.decompose:main"
dmel-mrs = "dmel.build_mrs:main"
dmel-train = "dmel.train:main"
dmel-evaluate = "dmel.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmel"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

# CUDA 12.6: incluye kernels sm_80 (A100) y funciona con el driver de KHIPU
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ty.environment]
python = ".venv"

[tool.pyright]
extraPaths = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
